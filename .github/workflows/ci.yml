name: CI

on:
  push:
    branches:
      - develop
      - main
      - frontend
      - backend
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - develop
      - main
      - frontend
      - backend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-monorepo:
    name: Frontend (monorepo)
    if: >-
      github.ref_name == 'develop' || github.ref_name == 'main' ||
      startsWith(github.ref_name, 'release/') ||
      (github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies from monorepo lockfile
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Lint
        run: pnpm exec eslint .
      - name: Check formatting
        run: pnpm exec prettier --check "src/**/*.{js,jsx,ts,tsx,vue}"
      - name: Type-check and build
        run: pnpm build
      - name: Tests
        run: pnpm exec vitest run --passWithNoTests

  backend-monorepo:
    name: Backend (monorepo)
    if: >-
      github.ref_name == 'develop' || github.ref_name == 'main' ||
      startsWith(github.ref_name, 'release/') ||
      (github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff formatting
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest (if tests exist)
        shell: bash
        run: |
          if find . -path './.venv' -prune -o -type f -name 'test_*.py' -print -quit | grep -q .; then
            uv run pytest
          else
            echo "No Python tests found yet; skipping pytest."
          fi

  frontend-standalone:
    name: Frontend (isolated branch)
    if: >-
      github.ref_name == 'frontend' ||
      startsWith(github.ref_name, 'feature/frontend/') ||
      (github.event_name == 'pull_request' && github.base_ref == 'frontend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm exec eslint .
      - name: Check formatting
        run: pnpm exec prettier --check "src/**/*.{js,jsx,ts,tsx,vue}"
      - name: Type-check and build
        run: pnpm build
      - name: Tests
        run: pnpm exec vitest run --passWithNoTests

  backend-standalone:
    name: Backend (isolated branch)
    if: >-
      github.ref_name == 'backend' ||
      startsWith(github.ref_name, 'feature/backend/') ||
      (github.event_name == 'pull_request' && github.base_ref == 'backend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff formatting
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest (if tests exist)
        shell: bash
        run: |
          if find . -path './.venv' -prune -o -type f -name 'test_*.py' -print -quit | grep -q .; then
            uv run pytest
          else
            echo "No Python tests found yet; skipping pytest."
          fi
